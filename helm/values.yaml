image:
  repository: ghcr.io/epics-containers/epics-gateways-runtime
  # tag defaults to Chart.appVersion if not set
  tag: ""

imagePullPolicy: IfNotPresent

overrideConfig: false

# set the CA and PVA server ports that the gateways will listen on
caServerPort: 9064
pvaServerPort: 9075

# pick a loadBalancerIP
loadBalancerIP: ""

# set the node name to use for the gateway only for use where you need to run
# in a specific subnet. e.g. DLS training rigs.
# DONT run on the SAME node as the IOCs to avoid localhost dual binding issues
nodeName:

# set the maximum size of arrays that can be sent over CA
caMaxArrayBytes: "3000000"

# the longest gap, in seconds, between the CA gateway's searches for a PV it
# cannot find. After a disconnect the gap grows from a fraction of a second to
# this cap, so it bounds how long an IOC that was down a long time takes to
# reappear. libca's default is 300; 60 is the lowest it accepts
caMaxSearchPeriod: "60"

# set to false to run the gateway in clusterIP mode
hostNetwork: true

# set these to space separated lists of IPs or DNS names to override the default
# of discovering IOCs in the same namespace.
pvaAddrList:
caAddrList:

# restart both gateways whenever an IOC service is created in the namespace
# after the gateways started, which they would otherwise never search. A
# restarted IOC keeps its service and needs no restart. Adds an ioc-watcher
# sidecar to the gateway pod.
# Only applies when hostNetwork is false: with hostNetwork the gateways find
# IOCs by broadcast and do not need restarting.
restartOnNewIocs: false

# set these to 1 to enable debugging
caDebug: 0
pvaDebug: 0

# override the pod security context if needed
securityContext: {}

# override pod tolerations if needed
tolerations: []

# override pod affinity if needed
affinity: {}

# schedule the gateway onto matching nodes, e.g. kubernetes.io/arch: amd64
nodeSelector: {}

# default resources. Override if needed
resources:
  limits:
    cpu: 800m
    memory: 1500Mi
  requests:
    cpu: 200m
    memory: 400Mi
