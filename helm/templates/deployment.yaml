{{- /* the ioc-watcher is only needed when IOCs are found by DNS name */}}
{{- $iocWatcher := and .Values.restartOnNewIocs (not .Values.hostNetwork) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: {{ .Release.Name }}
      {{- if $iocWatcher }}
      annotations:
        # restart the pod when the ioc-watcher script changes
        checksum/ioc-watcher: {{ .Files.Get "files/ioc_watcher.py" | sha256sum }}
      {{- end }}
    spec:
      {{- with .Values.nodeName }}
      nodeName: {{ . }}
      {{- end }}
      # enable the k8s service account so we can query for IOCs in the namespace
      serviceAccountName: default-full-access-mounted
      # if overrideConfig is set, mount the config map over the default
      # config files supplied inside the container image
      {{- if or .Values.overrideConfig $iocWatcher }}
      volumes:
        {{- if .Values.overrideConfig }}
        - name: config-volume
          configMap:
            name: {{ .Release.Name }}-config
        {{- end }}
        {{- if $iocWatcher }}
        - name: ioc-watcher
          configMap:
            name: {{ .Release.Name }}-ioc-watcher
        {{- end }}
      {{- end }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}-ca-gateway
          command:
           - bash
          args:
           - "/config/start-ca.sh"
          env: &env_gateways
            - name: EPICS_CA_MAX_ARRAY_BYTES
              value: {{ .Values.caMaxArrayBytes | quote }}
            - name: EPICS_CA_AUTO_ADDR_LIST
              value: {{ ternary "YES" "NO" .Values.hostNetwork | quote}}
            - name: EPICS_PVA_AUTO_ADDR_LIST
              value: {{ ternary "YES" "NO" .Values.hostNetwork | quote}}
            - name: EPICS_CA_ADDR_LIST
              value: {{ .Values.caAddrList  | quote}}
            - name: EPICS_PVA_ADDR_LIST
              value: {{ .Values.pvaAddrList  | quote}}
            - name: CA_SERVER_PORT
              value:  {{ .Values.caServerPort  | quote}}
            - name: PVA_SERVER_PORT
              value:  {{ .Values.pvaServerPort | quote }}
            - name: CA_DEBUG
              value: {{ .Values.caDebug | quote }}
            - name: PVA_DEBUG
              value: {{ .Values.pvaDebug | quote }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- with .Values.resources }}
          resources:
            {{-  toYaml . | nindent 12 }}
          {{- end }}
          stdin: true
          tty: true
          {{- if .Values.overrideConfig }}
          volumeMounts:
          - name: config-volume
            mountPath: /config
          {{- end }}

        - name: "{{ .Release.Name }}-pva-gateway"
          command:
           - bash
          args:
           - "/config/start-pva.sh"
          env: *env_gateways
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- with .Values.resources }}
          resources:
            {{-  toYaml . | nindent 12 }}
          {{- end }}
          stdin: true
          tty: true
          {{- if .Values.overrideConfig }}
          volumeMounts:
          - name: config-volume
            mountPath: /config
          {{- end }}

        {{- if $iocWatcher }}

        # restarts this pod when an IOC becomes Ready after the gateways started
        - name: ioc-watcher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
            - python3
          args:
            - "/ioc-watcher/ioc_watcher.py"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: ioc-watcher
              mountPath: /ioc-watcher
        {{- end }}

      {{- if .Values.nodeName }}
      nodeName: {{ .Values.nodeName }}
      {{- end }}
      {{ if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      restartPolicy: Always
      terminationGracePeriodSeconds: 1
